<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Preguntas CACES — Juego interactivo</title>
<style>
:root{
  --bg:#07111f; --panel:#0e1b2d; --panel2:#12243a; --text:#f7fbff;
  --muted:#a9b7c8; --accent:#63d8ff; --good:#56e39f; --bad:#ff7b7b;
  --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#173052 0,#07111f 48%,#040912 100%);
  color:var(--text); display:flex; justify-content:center;
}
.app{width:min(100%,920px); padding:14px 12px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:20px;margin:0}
.badge{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{
  border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:12px;
  padding:10px 13px;font-weight:700;cursor:pointer
}
button:active{transform:scale(.98)}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#8c7bff);transition:.25s}
.scene{perspective:1400px}
.card{
  min-height:720px; position:relative; transform-style:preserve-3d; transition:transform .55s;
  cursor:pointer;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:linear-gradient(145deg,rgba(18,36,58,.98),rgba(7,17,31,.98));
  border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 60px rgba(0,0,0,.35);
  overflow:hidden; display:flex; flex-direction:column;
}
.back{transform:rotateY(180deg)}
.questionTop{padding:17px 18px 8px}
.num{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.3px}
.question{font-size:20px;line-height:1.38;font-weight:750;margin-top:8px}
.options{padding:4px 18px 12px;display:grid;gap:9px}
.opt{
  padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);
  font-size:15px;line-height:1.35
}
.opt .letter{font-weight:900;color:var(--accent);margin-right:5px}
.imageBox{
  margin:4px 14px 14px; border-radius:18px; overflow:hidden; background:#03070d;
  min-height:245px; flex:1; position:relative; display:flex;align-items:center;justify-content:center;
}
.imageBox img{width:100%;height:100%;max-height:360px;object-fit:contain;display:block}
.loading{color:var(--muted);font-size:14px;padding:20px;text-align:center}
.caption{
  position:absolute;bottom:0;left:0;right:0;padding:7px 10px;font-size:11px;
  background:linear-gradient(transparent,rgba(0,0,0,.82));color:#dbe7f2
}
.source{
  padding:0 16px 14px;font-size:11px;color:var(--muted);min-height:26px
}
.source a{color:#8ee5ff}
.answerTitle{padding:28px 20px 6px;text-align:center;color:var(--good);font-size:14px;font-weight:900;text-transform:uppercase}
.answer{
  padding:8px 22px 14px;text-align:center;font-size:25px;line-height:1.3;font-weight:850
}
.explain{
  margin:0 20px 18px;padding:13px;border-radius:15px;background:rgba(86,227,159,.08);
  border:1px solid rgba(86,227,159,.2);font-size:13px;line-height:1.4;color:#d9f8e9
}
.back .imageBox{min-height:180px;max-height:280px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}
.counter{text-align:center;color:var(--muted);font-size:12px;margin:7px 0}
.noAnswer{color:#ffd48a}
@media(max-width:600px){
  .app{padding:10px 8px 20px}
  .card{min-height:calc(100vh - 155px)}
  .question{font-size:17px}
  .opt{font-size:14px;padding:10px}
  .imageBox{min-height:180px;margin:3px 10px 10px}
  .imageBox img{max-height:260px}
  .answer{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🩺 Preguntas CACES</h1>
      <div class="badge">Juego interactivo · imágenes reales de Internet</div>
    </div>
    <div class="badge" id="score">0 acertadas</div>
  </header>

  <div class="toolbar">
    <button id="shuffle">🔀 Mezclar</button>
    <button id="reset">↺ Reiniciar</button>
    <button id="showSource">🔗 Fuente imagen</button>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="scene">
    <div class="card" id="card" tabindex="0" aria-label="Tarjeta de pregunta. Toca para ver la respuesta.">
      <section class="face front">
        <div class="questionTop">
          <div class="num" id="num"></div>
          <div class="question" id="question"></div>
        </div>
        <div class="options" id="options"></div>
        <div class="imageBox" id="imageFront">
          <div class="loading">Buscando una imagen médica relacionada…</div>
        </div>
        <div class="source" id="sourceFront"></div>
      </section>

      <section class="face back">
        <div class="answerTitle">Respuesta correcta</div>
        <div class="answer" id="answer"></div>
        <div class="explain" id="explain"></div>
        <div class="imageBox" id="imageBack">
          <div class="loading">Cargando imagen real…</div>
        </div>
        <div class="source" id="sourceBack"></div>
      </section>
    </div>
  </div>

  <div class="counter" id="counter"></div>
  <div class="nav">
    <button id="prev">← Anterior</button>
    <button id="flip">👆 Ver respuesta</button>
    <button id="next">Siguiente →</button>
  </div>
  <div class="hint">Toca la tarjeta o “Ver respuesta”. En la parte posterior aparece la respuesta marcada.</div>
</div>

<script>
const QUESTIONS = [{"id": 1, "question": "¿Cuál es el manejo inicial de un varón con retención aguda de orina causada por hematuria con coágulos?", "options": ["Colocar un catéter de tres vías. -", "Realizar cistoscopia con dilatador uretral.", "Colocar una sonda suprapúbica.", "Colocar una sonda vesical Foley."], "answer_index": 0, "source_page": 2, "imageQueries": ["three way urinary catheter blood clots hematuria", "three way Foley catheter urology", "Colocar un catéter de tres vías. inicial retención aguda orina causada"]}, {"id": 2, "question": "Hombre de 72 años, acude a consulta externa por falta de aire de 3 meses de evolución, además tos nocturna ocasional, duerme con 2 almohadas desde hace 15 días. Mantiene su actividad física con ligera limitación por aparición de disnea. Niega insomnio o despertares nocturnos. Niega náuseas, vómitos, dolor abdominal. Antecedentes Infarto del miocardio hace 4 años. Examen físico: TA: 130 /80 mmHg, FC: 88 lpm, FR: 20 rpm, Saturación: 90% aire ambiente (2850m). Consciente. Cuello: ingurgitación yugular ausente, reflujo abdominoyugular positivo. Pulmones: a la auscultación murmullo vesicular conservado, estertores subcrepitantes en bases pulmonares. Corazón: ruidos cardíacos rítmicos, se ausculta un tercer ruido, no soplos. Extremidades: edema simétrico bilateral en tobillos y zonas pretibiales x/xxx. ¿Cuál de los siguientes es el síntoma más relevante en el paciente?", "options": ["Ortopnea.", "Fatiga. -", "Disnea.", "Disnea paroxística nocturna."], "answer_index": 0, "source_page": 2, "imageQueries": ["orthopnea patient sleeping sitting up heart failure", "orthopnea heart failure clinical", "Ortopnea. acude externa falta aire meses"]}, {"id": 3, "question": "Señale la patología en la cual la acidosis metabólica tiene anión “gab” (GA) normal:", "options": ["Insuficiencia suprarrenal.", "Cetoacidosis diabética.", "Intoxicación por etanol.", "Intoxicación con paracetamol"], "answer_index": 0, "source_page": 2, "imageQueries": eden consistir en congestión leve de la faringe, la conjuntiva palpebral o el tímpano, y en un aumento de tamaño de los ganglios suboccipitales.", "options": ["Roséola. -", "Sarampión. -", "Rubeóla.", "Mononucleosis infecciosa."], "answer_index": 0, "source_page": 3, "imageQueries": ["roseola infant rash clinical", "roseola infant exanthem", "Roséola. aguda autolimitada lactancia primera infancia"]}, {"id": 9, "question": "Un hombre de 32 años acude al servicio de emergencia por cuadro de 36 horas de evolución de fiebre, dolor muscular generalizado y decaimiento. Sus antecedentes personales incluyen uso de drogas ilícitas intravenosas, desde los 30 años. Al examen físico FC: 100/min, TA: 95/65 mmHg, FR: 22/min, temperatura 38.5 °C. A la auscultación cardíaca se escucha un soplo sistólico en foco tricúspideo, en las palmas de las manos y plantas de los pies hay presencia de máculas hemorrágicas, no dolorosas y hay presencia de petequias subungueales. ¿Cuál es el agente etiológico responsable del cuadro, teniendo en cuenta que el germen del paciente es coagulasa positiva?", "options": ["Staphylococcus aureus", "Estreptococo del grupo A", "Streptococcus viridans", "Enterococcus"], "answer_index": 0, "source_page": 4, "imageQueries": ["Staphylococcus aureus bacteria microscopy", "Staphylococcus aureus culture bacteria", "Staphylococcus aureus acude fiebre dolor muscular generalizado"]}, {"id": 10, "question": "Paciente masculino de 1 año. Motivo de consulta: 72 horas de fiebre, sin predominio horario, se acompaña de hiporexia. Su hermano presenta infección respiratoria alta en curso. No tiene antecedentes personales ni familiares de importancia. Examen físico: tensión arterial 85/60 mmHg, frecuencia cardíaca 120/minuto, temperatura axilar 38 °C, frecuencia respiratoria: 40/minuto, saturación de oxígeno 90 %. En boca se observa orofaringe eritematosa con úlceras blanquecinas puntiformes. En piel se observan máculas eritematosas escasas, en manos y pies. Resto del examen r igual. La presión arterial sistólica mayor a 100 mm de Hg garantiza una presión de perfusión cerebral adecuada. La glicemia que presenta el paciente es el objetivo a alcanzar por el riesgo a desarrollar hipoglucemia. Se debió haber realizado hiperventilación hasta lograr una PaCO2 menor a 35 mm de Hg. El manejo de los signos de hipertensión intracraneal utilizando manitol fue adecuado. El valor de hemoglobina que presenta el paciente está dentro del objetivo del tratamiento de la lesión cerebral.", "options": ["1, 2, 6. -", "1, 3, 5.", "2, 5, 6.", "3, 4, 5."], "answer_index": 0, "source_page": 6, "imageQueries": ["severe traumatic brain injury CT scan", "traumatic brain injury CT head", "1, 2, 6. peso residente manta interés sufre"]}, {"id": 16, "question": "Varón de 22 días llevado al servicio de urgencias del hospital por presentar hace dos días vómitos postprandiales no biliosos, los cuales se describen explosivos después de alimentarse, no presenta otros síntomas y la madre refiere que continúa alimentándose con avidez. Se refieren antecedentes personales de peso elevado para la edad gestacional sin morbilidades posteriores, alimentado con lactancia materna exclusiva. Al examen físico presenta buen estado general, normotérmico, saturación de oxígeno 95 % ambiente, frecuencia cardíaca y respiratoria normales para la edad. El abdomen se palpa blando y depresible con distensión ligera en el hemiabdomen superior. Biometría hemática normal. ¿Cuál es el examen más acertado para corroborar el diagnostico?", "options": ["Ecografía abdominal.", "Estudio digestivo contrastado de esófago, estómago y duodeno.", "TAC simple de abdomen.", "Radiografía de abdomen simple."], "answer_index": 0, "source_page": 6, "imageQueries": ["pyloric stenosis infant ultrasound", "infant hypertrophic pyloric stenosis ultrasound", "Ecografía abdominal. llevado urgencias hospital presentar hace"]}, {"id": 17, "question": "¿Qué características clínicas son comunes en la exploración física para let deck = QUESTIONS.slice();

const answerState = new Set();
const imageCache = new Map();

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function setFlip(v){
  flipped = v;
  card.classList.toggle("flipped", flipped);
}

function current(){ return deck[pos]; }

function normalizeOption(s){
  return String(s||"").replace(/\s+-\s*$/,"").trim();
}

async function findCommonsImage(queries){
  const key = JSON.stringify(queries);
  if(imageCache.has(key)) return imageCache.get(key);

  const badWords = /\b(diagram|diagramm|chart|graph|plot|map|mapa|flowchart|flow\s*chart|infographic|infografía|table|tabla|scheme|schematic|esquema|algorithm|algoritmo|logo|icon|symbol|símbolo|poster|timeline|histogram|book|books|cover|portada|textbook|manual|handbook|atlas|chapter|capítulo|pdf|lecture|slides|powerpoint|presentation)\b/i;

  async function commons(q){
    const api = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch="
      + encodeURIComponent(q)
      + "&gsrlimit=15&prop=imageinfo&iiprop=url|extmetadata|mime|size&iiurlwidth=1200&format=json&origin=*";
    const r = await fetch(api);
    if(!r.ok) throw new Error("Commons HTTP "+r.status);
    const j = await r.json();
    const pages = Object.values(j.query?.pages || {});
    const candidates = pages.map(p=>{
      const ii=p.imageinfo?.[0]||{};
      return {
        url: ii.thumburl || ii.url || "",
        title: p.title || "",
        page: "https://commons.wikimedia.org/wiki/" + encodeURIComponent((p.title||"").replaceAll(" ","_")),
        mime: ii.mime || "",
        width: ii.thumbwidth || ii.width || 0,
        height: ii.thumbheight || ii.height || 0
      };
    }).filter(x=>{
      if(!x.url) return false;
      if(!/^image\//.test(x.mime) && !/\.(jpe?g|png|webp)(\?|$)/i.test(x.url)) return false;
      if(badWords.test(x.title)) return false;
      if(x.width && x.height && (x.width<300 || x.height<220)) return false;
      return true;
    });
    // Prefer an actual clinical/radiological/medication photograph and penalize generic artwork.
    const qWords=q.toLowerCase().split(/[^a-z0-9áéíóúñ]+/i).filter(w=>w.length>=4);
    candidates.sort((a,b)=>{
      const score=x=>{
        let n=0; const t=x.title.toLowerCase();
        if(/\b(photo|photograph|clinical|patient|specimen|surgical|procedure|x.?ray|radiograph|ultrasound|sonograph|ct|mri|microscop|endoscop|ecg|electrocard|tablet|capsule|injection|culture|stain|histolog)\b/i.test(t)) n+=7;
        if(/\.(jpe?g|webp)(\?|$)/i.test(x.url)) n+=2;
        if(x.width>=600 && x.height>=400) n+=2;
        const overlap=qWords.reduce((acc,w)=>acc+(t.includes(w)?1:0),0);
        n+=Math.min(overlap,5);
        return n;
      };
      return score(b)-score(a);
    });
    return candidates[0] || null;
  }

  async function wikipedia(q){
    const api="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="
      +encodeURIComponent(q)
      +"&gsrlimit=8&gsrnamespace=0&prop=pageimages|info&inprop=url&piprop=thumbnail|original&pilimit=8&pithumbsize=1200&format=json&origin=*";
    const r=await fetch(api);
    if(!r.ok) throw new Error("Wikipedia HTTP "+r.status);
    const j=await r.json();
    const pages=Object.values(j.query?.pages||{});
    const candidates=pages.map(p=>({
      url:p.thumbnail?.source||p.original?.source||"",
      title:p.title||"",
      page:p.fullurl||("https://en.wikipedia.org/wiki/"+encodeURIComponent((p.title||"").replaceAll(" ","_"))),
      width:p.thumbnail?.width||p.original?.width||0,
      height:p.thumbnail?.height||p.original?.height||0
    })).filter(x=>x.url && !badWords.test(x.title) && (!x.width || x.width>=300));
    return candidates[0]||null;
  }

  // Try several focused searches until a real raster image is found.
  for(const q of queries){
    try{
      const im=await commons(q);
      if(im){
        im.query=q;
        imageCache.set(key,im);
        return im;
      }
    }catch(e){}
  }
  // Wikipedia is a second source of actual article thumbnails, not diagrams/placeholders.
  for(const q of queries){
    try{
      const im=await wikipedia(q);
      if(im){
        im.query=q;
        imageCache.set(key,im);
        return im;
      }
    }catch(e){}
  }

  // Last resort: a real Wikimedia image search page is not displayed as the image;
  // instead, use a neutral medical photograph from a public Commons category via API.
  const fallbackQueries=["clinical photograph patient hospital","medical procedure photograph patient","clinical examination photograph"];
  for(const q of fallbackQueries){
    try{
      const im=await commons(q);
      if(im){
        im.query=q;
        imageCache.set(key,im);
        return im;
      }
    }catch(e){}
  }
  const fallback={
    url:"",
    title:"No se pudo cargar una imagen desde Internet",
    page:"https://commons.wikimedia.org/wiki/Category:Medical_photography",
    isSearch:true
  };
  imageCache.set(key,fallback);
  return fallback;
}

function putImage(boxId, src, title, page){
  const box=$(boxId);
  box.innerHTML="";
  if(src && !src.startsWith("https://commons.wikimedia.org/wiki/Special:MediaSearch")){
    const img=document.createElement("img");
    img.alt=title || "Imagen médica relacionada con la respuesta correcta";
    img.loading="eager";
    img.src=src;
    img.onerror=()=>{ box.innerHTML='<div class="loading">No se pudo cargar esta imagen. Usa “Fuente imagen” para verla.</div>'; };
    box.appendChild(img);
    const cap=document.createElement("div");
    cap.className="caption";
    cap.textContent=title || "Imagen médica";
    box.appendChild(cap);
  }else{
    box.innerHTML='<div class="loading">No se encontró una imagen incrustable. Puedes abrir la búsqueda de imágenes médicas.</div>';
  }
}

function render(){
  const q=current();
  $("num").textContent=`PREGUNTA ${q.id}`;
  $("question").textContent=q.question;
  $("counter").textContent=`${pos+1} de ${deck.length}`;
  $("bar").style.width=((pos+1)/deck.length*100)+"%";
  $("score").textContent=`${correctCount} acertadas`;

  $("options").innerHTML=q.options.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    return `<div class="opt"><span class="letter">${letter}.</span>${esc(normalizeOption(o))}</div>`;
  }).join("");

  if(q.answer_index === null || q.answer_index === undefined){
    $("answer").innerHTML='<span class="noAnswer">No está marcada en el PDF</span>';
    $("explain").textContent="La pregunta 68 no tiene una opción resaltada en amarillo en el documento original, por lo que no se ha inventado una respuesta.";
  }else{
    const ans=normalizeOption(q.options[q.answer_index]);
    $("answer").textContent=`${String.fromCharCode(65+q.answer_index)}. ${ans}`;
    $("explain").textContent="La respuesta mostrada corresponde a la opción resaltada en amarillo en el PDF proporcionado.";
  }

  $("imageFront").innerHTML='<div class="loading">Buscando una imagen real relacionada con la respuesta…</div>';
  $("imageBack").innerHTML='<div class="loading">Cargando imagen real…</div>';
  $("sourceFront").innerHTML="";
  $("sourceBack").innerHTML="";
  setFlip(false);

  findCommonsImage(q.imageQueries).then(im=>{
    putImage("imageFront",im.url,im.title,im.page);
    putImage("imageBack",im.url,im.title,im.page);
    const link=`<a href="${esc(im.page)}" target="_blank" rel="noopener">Ver imagen y fuente</a>`;
    $("sourceFront").innerHTML=link;
    $("sourceBack").innerHTML=link;
  });
}

function next(){
  if(pos < deck.length-1){ pos++; render(); }
}
function prev(){
  if(pos > 0){ pos--; render(); }
}
function flip(){
  setFlip(!flipped);
  if(flipped && current().answer_index !== null && !answerState.has(current().id)){
    answerState.add(current().id);
    correctCount++;
    $("score").textContent=`${correctCount} vistas`;
  }
}

card.addEventListener("click", e=>{
  if(e.target.closest("a")) return;
  flip();
});
$("flip").onclick=flip;
$("next").onclick=next;
$("prev").onclick=prev;
$("reset").onclick=()=>{
  deck=QUESTIONS.slice(); pos=0; correctCount=0; answerState.clear(); render();
};
$("shuffle").onclick=()=>{
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  pos=0; render();
};
$("showSource").onclick=()=>{
  const q=current();
  findCommonsImage(q.imageQuery).then(im=>window.open(im.page,"_blank"));
};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
  if(e.key===" " || e.key==="Enter"){e.preventDefault();flip();}
});

render();
</script>
</body>
</html>
